# Template for a local stdio MCP server in Codex.
# Install dependencies first and replace BOTH C:\path\to\UniPlan-MCP paths
# with the absolute location of your own checkout. Preserve unrelated settings.
[mcp_servers.uniplan]
command = 'C:\path\to\UniPlan-MCP\.venv\Scripts\python.exe'
args = ['C:\path\to\UniPlan-MCP\mcp_server.py']
startup_timeout_sec = 15
tool_timeout_sec = 20

# Start the FastAPI process separately before invoking tools.
[mcp_servers.uniplan.env]
APP_BASE_URL = 'http://127.0.0.1:8000'
